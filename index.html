<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<title>Kiedy trymować? – prototyp</title>
<!-- apply a stored Light / Dark choice before the first paint (key: THEME_KEY in src/storage/preferences.ts) -->
<script>try{var t=localStorage.getItem('kiedy-trymowac-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<main></main>
<footer class="site-footer"></footer>
</body>
</html>
